[platformio]
default_envs = central

[env]
; pioarduino fork: platform resmi PlatformIO belum menyediakan board ESP32-H2
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
board = esp32-h2-devkitm-1
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino@^2.2.3
    adafruit/Adafruit NeoPixel@^1.15.5

; Port di-pin agar tidak salah flash saat tiga board terpasang bersamaan.
; Sesuaikan dengan hasil `pio device list` di komputer masing-masing —
; Windows memakai COMx, Linux /dev/ttyACMx.
[env:nodea]
build_src_filter = +<nodea/*.cpp>
upload_port  = /dev/ttyACM0     ; sensor jendela  · Windows: COM3
monitor_port = /dev/ttyACM0

[env:nodeb]
build_src_filter = +<nodeb/*.cpp>
upload_port  = /dev/ttyACM2     ; sensor pintu    · Windows: COM4
monitor_port = /dev/ttyACM2

[env:central]
build_src_filter = +<central/*.cpp>
upload_port  = /dev/ttyACM4     ; hub             · Windows: COM5
monitor_port = /dev/ttyACM4
