[platformio]
default_envs = controller

[env]
; pioarduino fork: platform resmi PlatformIO belum menyediakan board ESP32-H2
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
board = esp32-h2-devkitm-1
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino@^2.2.3
    adafruit/Adafruit NeoPixel@^1.15.5

; Catatan batas perangkat keras: pada ESP32-H2 dengan Arduino core ini,
; controller BLE hanya menyediakan memori untuk DUA koneksi serentak.
; Koneksi ketiga membuat npl_freertos_callout_init() gagal dan board reboot.
; Batas itu berada di pustaka controller yang sudah terkompilasi, sehingga
; TIDAK dapat dinaikkan lewat build flag (-DCONFIG_BT_LE_MAX_CONNECTIONS
; sudah dicoba dan tidak berpengaruh). Karena itu controller memakai pola
; sambung-saat-dibutuhkan; lihat MAX_KONEKSI di src/controller/main.cpp.

; Port di-pin agar tidak salah flash saat beberapa board terpasang bersamaan.
; Pakai port jembatan USB-to-UART (Hardware ID 1A86:55D3) — pada Linux
; nomornya genap. Sesuaikan dengan hasil `pio device list`.
[env:controller]
build_src_filter = +<controller/*.cpp>
upload_port  = /dev/ttyACM0
monitor_port = /dev/ttyACM0

; Ketiga pager memakai source yang sama; hanya nomor pagernya yang berbeda.
; Inilah alasan ID diberikan lewat build flag, bukan lewat tiga salinan file.
[env:pager101]
build_src_filter = +<pager/*.cpp>
build_flags = -DPAGER_ID=101
upload_port  = /dev/ttyACM2
monitor_port = /dev/ttyACM2

[env:pager102]
build_src_filter = +<pager/*.cpp>
build_flags = -DPAGER_ID=102
upload_port  = /dev/ttyACM4
monitor_port = /dev/ttyACM4

[env:pager103]
build_src_filter = +<pager/*.cpp>
build_flags = -DPAGER_ID=103
upload_port  = /dev/ttyACM6
monitor_port = /dev/ttyACM6
